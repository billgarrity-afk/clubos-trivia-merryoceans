<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#152E3E">
<title>Merry Oceans Trivia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ocean:    #152E3E;
  --ocean-mid:#1D4B64;
  --teal:     #4EA89E;
  --seafoam:  #A8D4CE;
  --gold:     #D4A843;
  --gold-dim: #8B6B28;
  --coral:    #D6604A;
  --cream:    #FBF7EF;
  --sand:     #F0E4C4;
  --white:    #FFFFFF;
  --text:     #1E2820;
  --correct:  #2E9E6B;
  --wrong:    #D6604A;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; background:var(--ocean); color:var(--white); }
.app { height:100dvh; display:flex; flex-direction:column; overflow:hidden; position:relative; }

/* ── SCREENS ── */
.screen { position:absolute; inset:0; display:flex; flex-direction:column; transition:opacity 0.35s ease, transform 0.35s ease; }
.screen.hidden { opacity:0; transform:translateY(16px); pointer-events:none; }

/* ── SHARED HEADER ── */
.top-bar {
  background:var(--ocean);
  padding:max(env(safe-area-inset-top),16px) 20px 14px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.top-bar::after { content:''; position:absolute; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--teal),transparent); opacity:0.35; top:calc(max(env(safe-area-inset-top),16px) + 54px); }
.logo-mark { width:38px; height:38px; border-radius:50%; overflow:hidden; border:1.5px solid rgba(212,168,67,0.4); flex-shrink:0; }
.logo-mark img { width:100%; height:100%; object-fit:cover; }
.top-title { font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--white); }
.top-sub { font-size:11px; color:var(--teal); letter-spacing:0.5px; margin-top:1px; }
.score-badge { margin-left:auto; background:rgba(212,168,67,0.15); border:1px solid rgba(212,168,67,0.3); border-radius:20px; padding:5px 12px; font-family:'DM Mono',monospace; font-size:13px; color:var(--gold); font-weight:500; }

/* ═══════════════════════════
   HOME SCREEN
═══════════════════════════ */
#homeScreen {
  background:var(--ocean);
  overflow-y:auto;
  align-items:center;
}
#homeScreen::before { content:''; position:fixed; top:0; left:0; right:0; height:50%; background:radial-gradient(ellipse at 50% 0%, rgba(78,168,158,0.15) 0%, transparent 60%); pointer-events:none; }

.home-inner { padding:max(env(safe-area-inset-top),24px) 24px 40px; display:flex; flex-direction:column; align-items:center; width:100%; position:relative; }

.home-logo { width:72px; height:72px; border-radius:50%; overflow:hidden; border:2px solid rgba(212,168,67,0.45); box-shadow:0 0 28px rgba(212,168,67,0.18); margin-bottom:8px; }
.home-logo img { width:100%; height:100%; object-fit:cover; }
.home-property { font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:20px; }

.home-huck { width:110px; height:110px; border-radius:50%; overflow:hidden; border:2.5px solid rgba(212,168,67,0.4); box-shadow:0 0 32px rgba(212,168,67,0.18),0 8px 24px rgba(0,0,0,0.35); margin-bottom:14px; }
.home-huck img { width:100%; height:100%; object-fit:cover; object-position:center 10%; }

.home-title { font-family:'Fraunces',serif; font-size:32px; font-weight:700; color:var(--white); line-height:1; margin-bottom:4px; }
.home-title em { color:var(--gold); font-style:italic; }
.home-sub { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--teal); margin-bottom:16px; }
.home-desc { font-size:15px; color:rgba(255,255,255,0.65); text-align:center; line-height:1.6; max-width:300px; margin-bottom:28px; }

/* name input */
.name-section { width:100%; max-width:320px; margin-bottom:24px; }
.name-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:8px; display:block; }
.name-input { width:100%; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.15); border-radius:12px; padding:13px 16px; font-family:'DM Sans',sans-serif; font-size:16px; color:var(--white); outline:none; transition:border-color 0.2s; }
.name-input::placeholder { color:rgba(255,255,255,0.3); }
.name-input:focus { border-color:rgba(78,168,158,0.6); }

/* category grid */
.cat-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:12px; width:100%; max-width:340px; }
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:340px; margin-bottom:24px; }
.cat-card { background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 16px; cursor:pointer; transition:all 0.2s; text-align:left; }
.cat-card:active { transform:scale(0.97); }
.cat-card.selected { background:rgba(78,168,158,0.18); border-color:var(--teal); }
.cat-card.selected .cat-name { color:var(--white); }
.cat-emoji { font-size:22px; margin-bottom:6px; display:block; }
.cat-name { font-size:13px; font-weight:600; color:rgba(255,255,255,0.7); line-height:1.3; }
.cat-count { font-size:11px; color:rgba(255,255,255,0.3); margin-top:2px; }

.start-btn { width:100%; max-width:320px; padding:16px; background:var(--gold); color:var(--ocean); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer; transition:opacity 0.2s,transform 0.1s; }
.start-btn:disabled { opacity:0.4; }
.start-btn:not(:disabled):active { transform:scale(0.98); opacity:0.9; }

/* ═══════════════════════════
   GAME SCREEN
═══════════════════════════ */
#gameScreen { background:#0F2330; }

.progress-bar-wrap { height:3px; background:rgba(255,255,255,0.07); flex-shrink:0; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width 0.4s ease; }

.game-body { flex:1; overflow-y:auto; padding:20px 20px 100px; -webkit-overflow-scrolling:touch; }

.q-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.q-num { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--teal); font-weight:600; }
.q-cat { font-size:11px; color:rgba(255,255,255,0.35); }

.q-text { font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--white); line-height:1.35; margin-bottom:28px; }

.answers { display:flex; flex-direction:column; gap:10px; }
.answer-btn {
  background:rgba(255,255,255,0.06);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:15px 18px;
  text-align:left;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:500;
  color:var(--white);
  transition:all 0.2s;
  display:flex; align-items:center; gap:12px;
  line-height:1.4;
}
.answer-btn:not(:disabled):active { transform:scale(0.98); }
.answer-btn.selected { background:rgba(78,168,158,0.15); border-color:var(--teal); }
.answer-btn.correct { background:rgba(46,158,107,0.2); border-color:var(--correct); color:var(--white); }
.answer-btn.wrong { background:rgba(214,96,74,0.15); border-color:var(--wrong); color:rgba(255,255,255,0.6); }
.answer-btn:disabled { cursor:default; }
.answer-letter { width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:rgba(255,255,255,0.5); flex-shrink:0; transition:all 0.2s; }
.answer-btn.correct .answer-letter { background:var(--correct); color:var(--white); }
.answer-btn.wrong .answer-letter { background:var(--wrong); color:var(--white); }
.answer-btn.selected:not(.correct):not(.wrong) .answer-letter { background:var(--teal); color:var(--ocean); }

.feedback-bar { margin-top:16px; padding:12px 16px; border-radius:10px; font-size:14px; font-weight:600; display:none; }
.feedback-bar.correct { background:rgba(46,158,107,0.15); border:1px solid rgba(46,158,107,0.3); color:#5DD4A0; display:block; }
.feedback-bar.wrong { background:rgba(214,96,74,0.12); border:1px solid rgba(214,96,74,0.25); color:#F08070; display:block; }

/* fixed next button */
.next-btn-wrap { position:fixed; bottom:0; left:0; right:0; padding:16px 20px; padding-bottom:max(env(safe-area-inset-bottom),16px); background:linear-gradient(transparent,#0F2330 40%); }
.next-btn { width:100%; padding:15px; background:var(--teal); color:var(--ocean); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer; display:none; transition:opacity 0.2s; }
.next-btn.visible { display:block; }

/* ═══════════════════════════
   RESULTS SCREEN
═══════════════════════════ */
#resultsScreen { background:var(--ocean); overflow-y:auto; }
#resultsScreen::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 50% 20%, rgba(212,168,67,0.12) 0%, transparent 50%); pointer-events:none; }

.results-inner { padding:32px 24px max(env(safe-area-inset-bottom),32px); display:flex; flex-direction:column; align-items:center; position:relative; }

.results-huck { width:90px; height:90px; border-radius:50%; overflow:hidden; border:2.5px solid var(--gold); box-shadow:0 0 32px rgba(212,168,67,0.25); margin-bottom:16px; }
.results-huck img { width:100%; height:100%; object-fit:cover; object-position:center 10%; }

.results-title { font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:var(--white); margin-bottom:4px; text-align:center; }
.results-score-big { font-family:'DM Mono',monospace; font-size:56px; font-weight:500; color:var(--gold); line-height:1; margin:16px 0 4px; }
.results-score-label { font-size:13px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; margin-bottom:20px; }
.results-msg { font-size:15px; color:rgba(255,255,255,0.65); text-align:center; line-height:1.6; max-width:280px; margin-bottom:28px; }

.results-divider { width:100%; height:1px; background:linear-gradient(90deg,transparent,rgba(78,168,158,0.3),transparent); margin:24px 0; }

.results-actions { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
.btn-primary { width:100%; padding:15px; background:var(--gold); color:var(--ocean); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; }
.btn-secondary { width:100%; padding:15px; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.1); color:var(--white); border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; cursor:pointer; }

/* leaderboard preview on results */
.lb-preview { width:100%; max-width:340px; margin-bottom:8px; }
.lb-preview-title { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:10px; font-weight:600; }
.lb-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px; }
.lb-rank { font-family:'DM Mono',monospace; font-size:13px; color:var(--gold); min-width:20px; font-weight:500; }
.lb-name { flex:1; font-size:14px; color:var(--white); font-weight:500; }
.lb-pts { font-family:'DM Mono',monospace; font-size:13px; color:var(--teal); }
.lb-row.me { background:rgba(78,168,158,0.12); border:1px solid rgba(78,168,158,0.2); }

/* ── TIMER ── */
.timer-ring { position:relative; width:44px; height:44px; flex-shrink:0; margin-left:auto; }
.timer-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:14px; color:var(--white); font-weight:500; }
.timer-svg { transform:rotate(-90deg); }
.timer-circle { transition:stroke-dashoffset 1s linear; stroke-linecap:round; }

@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.anim { animation:fadeUp 0.3s ease both; }
</style>
</head>

ich singer is known as 'Queen Bey'?", "answers": ["Rihanna", "Adele", "Beyonc\u00e9", "Mariah Carey"], "correct": 2}, {"q": "What is the name of the fictional kingdom in 'Frozen'?", "answers": ["Narnia", "Arendelle", "Elsinore", "Zootopia"], "correct": 1}, {"q": "Which social media platform is known for short viral videos?", "answers": ["Instagram", "Snapchat", "TikTok", "Twitter"], "correct": 2}, {"q": "What movie franchise features the character Jack Sparrow?", "answers": ["Indiana Jones", "Pirates of the Caribbean", "The Mummy", "National Treasure"], "correct": 1}, {"q": "'The Office' is set in which fictional Pennsylvania city?", "answers": ["Pittsburgh", "Allentown", "Scranton", "Harrisburg"], "correct": 2}, {"q": "Which actor plays Iron Man in the Marvel Cinematic Universe?", "answers": ["Chris Evans", "Chris Hemsworth", "Robert Downey Jr.", "Mark Ruffalo"], "correct": 2}, {"q": "What is the best-selling video game franchise of all time?", "answers": ["Call of Duty", "Grand Theft Auto", "Mario", "FIFA"], "correct": 2}]}};

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let playerName = '';
let selectedCat = '';
let gameQuestions = [];
let currentQ = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let timeLeft = 20;
const POINTS_PER_CORRECT = 100;
const TIME_BONUS_MAX = 50;

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function init() {
  buildCatGrid();
  document.getElementById('playerName').addEventListener('input', checkReady);
  // Pre-fill from localStorage if returning player
  const saved = localStorage.getItem('mo_player_name');
  if (saved) { document.getElementById('playerName').value = saved; }
}

function buildCatGrid() {
  const grid = document.getElementById('catGrid');
  Object.entries(ALL_QUESTIONS).forEach(([key, cat]) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.key = key;
    card.innerHTML = `<span class="cat-emoji">${cat.emoji}</span><div class="cat-name">${cat.label}</div><div class="cat-count">10 questions</div>`;
    card.onclick = () => selectCat(key);
    grid.appendChild(card);
  });
}

function selectCat(key) {
  selectedCat = key;
  document.querySelectorAll('.cat-card').forEach(c => c.classList.toggle('selected', c.dataset.key === key));
  checkReady();
}

function checkReady() {
  playerName = document.getElementById('playerName').value.trim();
  localStorage.setItem('mo_player_name', playerName);
  localStorage.setItem('mo_player_id', localStorage.getItem('mo_player_id') || Math.random().toString(36).substr(2,10));
  document.getElementById('startBtn').disabled = !(playerName && selectedCat);
}

// ══════════════════════════════════════════
// GAME
// ══════════════════════════════════════════
function startGame() {
  const cat = ALL_QUESTIONS[selectedCat];
  gameQuestions = shuffle([...cat.questions]);
  currentQ = 0; score = 0;
  document.getElementById('gameTitle').textContent = cat.label;
  document.getElementById('gameSub').textContent = cat.emoji + ' Merry Oceans Trivia';
  showScreen('gameScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = gameQuestions[currentQ];
  const total = gameQuestions.length;
  answered = false;

  document.getElementById('progressBar').style.width = (currentQ / total * 100) + '%';
  document.getElementById('scoreDisplay').textContent = score + ' pts';
  document.getElementById('nextBtn').classList.remove('visible');

  const body = document.getElementById('gameBody');
  const letters = ['A','B','C','D'];

  body.innerHTML = `
    <div class="q-meta anim">
      <div class="q-num">Question ${currentQ + 1} of ${total}</div>
      <div class="q-cat" id="catLabel">${ALL_QUESTIONS[selectedCat].emoji} ${ALL_QUESTIONS[selectedCat].label}</div>
    </div>
    <div class="timer-ring anim" style="margin-bottom:16px;">
      <svg class="timer-svg" width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
        <circle class="timer-circle" id="timerCircle" cx="22" cy="22" r="18" fill="none" stroke="var(--teal)" stroke-width="3"
          stroke-dasharray="113" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text" id="timerText">20</div>
    </div>
    <div class="q-text anim">${q.q}</div>
    <div class="answers anim" id="answersEl">
      ${q.answers.map((a, i) => `
        <button class="answer-btn" onclick="selectAnswer(${i})">
          <div class="answer-letter">${letters[i]}</div>
          <span>${a}</span>
        </button>`).join('')}
    </div>
    <div class="feedback-bar" id="feedbackBar"></div>
  `;

  startTimer();
}

function startTimer() {
  timeLeft = 20;
  clearInterval(timerInterval);
  const circle = document.getElementById('timerCircle');
  const timerText = document.getElementById('timerText');
  const circumference = 113;

  timerInterval = setInterval(() => {
    timeLeft--;
    timerText.textContent = timeLeft;
    const offset = circumference * (1 - timeLeft / 20);
    circle.style.strokeDashoffset = offset;
    if (timeLeft <= 5) circle.style.stroke = 'var(--coral)';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 1000);
}

function timeUp() {
  answered = true;
  const q = gameQuestions[currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  btns[q.correct].classList.add('correct');
  const fb = document.getElementById('feedbackBar');
  fb.className = 'feedback-bar wrong';
  fb.textContent = '⏰ Time's up! The answer was ' + q.answers[q.correct];
  document.getElementById('nextBtn').classList.add('visible');
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = gameQuestions[currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedbackBar');
  const timeBonus = Math.round((timeLeft / 20) * TIME_BONUS_MAX);

  if (idx === q.correct) {
    btns[idx].classList.add('correct');
    const pts = POINTS_PER_CORRECT + timeBonus;
    score += pts;
    fb.className = 'feedback-bar correct';
    fb.textContent = `✓ Correct! +${pts} points (${timeBonus > 0 ? '+' + timeBonus + ' speed bonus' : 'no speed bonus'})`;
  } else {
    btns[idx].classList.add('wrong');
    btns[q.correct].classList.add('correct');
    fb.className = 'feedback-bar wrong';
    fb.textContent = `✗ Not quite — the answer was "${q.answers[q.correct]}"`;
  }

  document.getElementById('scoreDisplay').textContent = score + ' pts';
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= gameQuestions.length) {
    endGame();
  } else {
    renderQuestion();
  }
}

// ══════════════════════════════════════════
// END GAME
// ══════════════════════════════════════════
async function endGame() {
  document.getElementById('progressBar').style.width = '100%';
  const pct = score / (gameQuestions.length * (POINTS_PER_CORRECT + TIME_BONUS_MAX / 2));

  let title, msg;
  if (pct >= 0.85) { title = "Huck is impressed."; msg = "That's a serious score. You might know Topsail better than most locals."; }
  else if (pct >= 0.6) { title = "Solid round!"; msg = "Good stuff. Come back and see if you can beat your score — or try a different category."; }
  else if (pct >= 0.35) { title = "Not bad!"; msg = "You're just getting warmed up. Try the Local category if you want a real challenge."; }
  else { title = "Huck's got you covered."; msg = "That's what I'm here for. Explore the island and you'll ace this next time."; }

  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('resultsBig').textContent = score;
  document.getElementById('resultsLabel').textContent = 'out of ' + (gameQuestions.length * (POINTS_PER_CORRECT + TIME_BONUS_MAX)) + ' possible';
  document.getElementById('resultsMsg').textContent = msg;

  // Save to Supabase trivia leaderboard
  try {
    await fetch(SUPABASE_URL + '/rest/v1/trivia_scores', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        player_name: playerName,
        score: score,
        category: selectedCat,
        property_id: 'merry-oceans'
      })
    });
  } catch(e) { console.log('Score save failed', e); }

  // Award weekend points
  try {
    const playerId = localStorage.getItem('mo_player_id') || playerName;
    await fetch(SUPABASE_URL + '/rest/v1/merry_oceans_points', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        player_id: playerId,
        player_name: playerName,
        points: score,
        action: 'trivia_game',
        property_id: 'merry-oceans'
      })
    });
  } catch(e) { console.log('Points award failed', e); }

  // Load leaderboard
  loadLeaderboard();
  showScreen('resultsScreen');
}

async function loadLeaderboard() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/trivia_scores?property_id=eq.merry-oceans&order=score.desc&limit=5',
      { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } }
    );
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) return;

    const lb = document.getElementById('lbPreview');
    lb.innerHTML = '<div class="lb-preview-title">🏆 Leaderboard</div>' +
      data.map((r, i) => {
        const isMe = r.player_name === playerName && r.score === score;
        return `<div class="lb-row${isMe ? ' me' : ''}">
          <div class="lb-rank">#${i+1}</div>
          <div class="lb-name">${r.player_name}</div>
          <div class="lb-pts">${r.score} pts</div>
        </div>`;
      }).join('');
  } catch(e) { console.log('Leaderboard load failed', e); }
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.toggle('hidden', s.id !== id);
  });
}

function goHome() {
  clearInterval(timerInterval);
  currentQ = 0; score = 0; answered = false;
  showScreen('homeScreen');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

init();
</script>
